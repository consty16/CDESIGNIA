[functions]
  node_bundler = "esbuild"

[functions."procesar-ia"]
  timeout = 26

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# IA Lab must be matched BEFORE the catch-all SPA redirect
[[redirects]]
  from = "/ia-lab"
  to = "/ia-lab.html"
  status = 200

# SPA catch-all for React Router routes (main app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://cdesignia.netlify.app; form-action 'self';"