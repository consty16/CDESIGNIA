[functions]
  node_bundler = "esbuild"

[functions."procesar-ia"]
  timeout = 26

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# IA Lab must be matched BEFORE the catch-all SPA redirect
[[redirects]]
  from = "/ia-lab"
  to = "/ia-lab.html"
  status = 200

# SPA catch-all for React Router routes (main app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false