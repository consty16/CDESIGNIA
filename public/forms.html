<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Forms Proxy</title>
</head>
<body>
    <!-- Este archivo permite que Netlify detecte el formulario en tiempo de build -->
    <form name="comentarios-clientes" data-netlify="true" hidden>
        <input type="text" name="name" />
        <input type="text" name="role" />
        <input type="number" name="stars" />
        <textarea name="text"></textarea>
    </form>
</body>
</html>
